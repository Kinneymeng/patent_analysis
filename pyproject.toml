[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-summarizer"
version = "0.1.0"
description = "Batch summarize Chinese patent PDF/DOCX documents with an OpenAI-compatible API."
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "Pillow>=10.0",
    "latex2mathml>=3.77",
    "playwright>=1.50",
]

[project.optional-dependencies]
pdf = ["pdfplumber", "pypdf"]
ocr = ["pdf2image", "pytesseract"]
portable = ["pypandoc-binary>=1.17", "pyinstaller>=6.0", "customtkinter>=5.2"]

[project.gui-scripts]
patent-summarizer-gui = "patent_summarizer.gui:launch"

[tool.setuptools.packages.find]
include = ["patent_summarizer*"]

[tool.setuptools.package-data]
"patent_summarizer.disclosure" = ["prompts/*.md", "THIRD_PARTY_NOTICES.md", "MERMAID_LICENSE.txt"]
"patent_summarizer.disclosure.cnipa_upstream" = ["LICENSE.txt"]
